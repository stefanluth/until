name: until-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-until}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-until}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  web:
    build:
      context: .
      target: dev
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-until}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-until}
      COOKIE_SECURE: 'false'
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  default:
  backend:
    internal: true

volumes:
  db_data:
